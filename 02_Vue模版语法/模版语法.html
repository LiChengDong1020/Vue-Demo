<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>初识Vue</title>
    <script type="text/javascript" src="../js/vue.js"></script>
</head>

<body>
    <div id="root">
        <h1>插值语法</h1>
        <h3>你好，{{data1.name}}</h3>
        <h1>指令语法</h1>
        <!-- <a href="{{url}}">百度一下</a> -->
        <!-- v-bind: 简写成 : -->
        <a v-bind:href="data2.url">{{data2.name}}</a>
        <!-- <a :href="url">百度一下</a> -->
        <!-- <a :href="url.toUpperCase()">百度一下</a> -->
        <!-- <a :href="Date.now()">百度一下</a> -->

    </div>
    <script type="text/javascript">
        Vue.config.productionTip = false
        // Vue.config.devtools = true
        new Vue({
            el: '#root',
            data: {
                data1: {
                    name: 'Jack'
                },
                data2: {
                    name: '百度一下',
                    url: "https://www.baidu.com"
                }

            }
        })
    </script>
</body>

</html>
